# Factor Quality Rebuild — Configuration
# ========================================
# Calibration: 2017-2020 (direction, transform, parameter selection)
# Validation:   2021-2024 (final gate, must not be used for tuning)
# Watch-only:   2025-2026 (if data exists, report only, no gate impact)

windows:
  calibration:
    start: "20170101"
    end: "20201231"
  validation:
    start: "20210101"
    end: "20241231"
  watch_only:
    start: "20250101"
    end: "20260605"

# Primary and auxiliary forward-return horizons
horizons:
  primary: "fwd_ret_5d"
  auxiliary: ["fwd_ret_10d", "fwd_ret_20d"]

# Cost assumptions (single-sided, in basis points)
cost:
  single_side_bps: 20          # 20 bps per side
  round_trip_bps: 40           # implicit: 2 × single_side_bps
  sensitivity: [10, 20, 30]    # sensitivity scenarios

# Factor universe — all candidates for audit
# role values:
#   alpha_candidate — eligible for PASS/WATCH and candidate pool
#   neutralizer     — used only for neutralization and exposure diagnosis
#   support_only    — informational only, never enters candidate pool
# data_lag_days:
#   0 for technical/price-based factors (available same day after close)
#   63 for fundamental factors (≈ 1 quarter financial reporting lag)
# date_semantics:
#   observation_date — trade_date in cache is the factor observation date;
#                       signal_date = first_trading_day_on_or_after(observation_date + data_lag_days)
# tradable_weighting:
#   equal_weight — equal-weighted top/bottom quintile portfolio
#   mcap_weight  — market-cap-weighted top/bottom quintile portfolio
factors:
  # --- Technical / price-based factors ---
  - name: reversal_5_cs
    category: reversal
    type: technical
    role: alpha_candidate
    sign_hint: positive         # + means: higher factor → higher return expected
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: reversal_20_cs
    category: reversal
    type: technical
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: momentum_60_cs
    category: momentum
    type: technical
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: momentum_120_cs
    category: momentum
    type: technical
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: volatility_20_cs
    category: volatility
    type: technical
    role: alpha_candidate
    sign_hint: negative         # low vol → higher return
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: volatility_60_cs
    category: volatility
    type: technical
    role: alpha_candidate
    sign_hint: negative
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: rsi_14_cs
    category: oscillator
    type: technical
    role: alpha_candidate
    sign_hint: negative         # oversold → higher return
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: macd_12_26_9_cs
    category: oscillator
    type: technical
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: pv_divergence_20_cs
    category: price_volume
    type: technical
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 0
    date_semantics: observation_date
    tradable_weighting: equal_weight
  # --- Fundamental / value factors ---
  - name: ep_cs
    category: value
    type: fundamental
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 63
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: bp_cs
    category: value
    type: fundamental
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 63
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: sp_cs
    category: value
    type: fundamental
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 63
    date_semantics: observation_date
    tradable_weighting: equal_weight
  # --- Fundamental / quality factors ---
  - name: roe_cs
    category: quality
    type: fundamental
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 63
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: gross_margin_cs
    category: quality
    type: fundamental
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 63
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: profit_growth_cs
    category: growth
    type: fundamental
    role: alpha_candidate
    sign_hint: positive
    data_lag_days: 63
    date_semantics: observation_date
    tradable_weighting: equal_weight
  - name: revenue_growth_cs
    category: growth
    type: fundamental
