# ── Basket construction rules ───────────────────────────────────────────
basket_rules:
  core_basket:
    description: "core 股票等权，单票权重上限 30%"
    pool_types: [core]
    min_pit_confidence: medium  # exclude 'low'
    weight_scheme: equal_weight
    max_single_weight: 0.30
    min_components: 3

  broad_basket:
    description: "core + adjacent，core 权重优先，adjacent 降权"
    pool_types: [core, adjacent]
    min_pit_confidence: medium
    weight_scheme: tiered
    core_weight_multiplier: 2.0   # core weight = 2x adjacent weight
    max_single_weight: 0.25
    min_components: 3

  mapping_sentiment_index:
    description: "mapping 股票只做情绪观察，不作为事件主依据"
    pool_types: [mapping]
    min_pit_confidence: low  # includes all for observation
    weight_scheme: equal_weight
    research_only: true

# ── Benchmark indices ────────────────────────────────────────────────────
benchmarks:
  market:
    - code: "000300.SH"
      name: "沪深300"
    - code: "000985.CSI"
      name: "中证全指"

  growth:
    - code: "399006.SZ"
      name: "创业板指"

  semiconductor:
    - code: "931865.CSI"
      name: "中证半导体产业指数"
      primary: true  # primary comparison target

# ── Eligibility filters (applied per stock at each date) ─────────────────
eligibility:
  min_list_days: 120                  # listed >= 120 trading days
  min_daily_amount_20d: 1.0e8         # avg daily amount >= 1亿
  amount_unit: thousand_cny           # prices.amount uses Tushare-style 千元
  exclude_st: true                    # exclude ST/*ST
  exclude_suspend: true               # exclude suspended stocks
  exclude_limit_down_event: true      # exclude if limit-down on event day
  exclude_consecutive_limit_down: true  # exclude if >=2 consecutive limit-down days
  exclude_limit_up_entry: true        # exclude if limit-up on entry (can't buy)

# ── Event clustering ─────────────────────────────────────────────────────
event_clustering:
  max_gap_trading_days: 5  # consecutive events within 5 trading days = same cluster

# ===========================================================================
