# ===========================================================================
# Photoresist Theme — Point-in-Time Stock Universe v2
# ===========================================================================
# Stock universe for the photoresist panic reversal research module.
#
# Principles:
#   - Point-in-Time: effective_start / effective_end define when a stock
#     belongs to the universe. Do NOT use stocks before effective_start.
#   - Coarse layering (core / adjacent / mapping), NOT pseudo-precise scores.
#   - source_type must be auditable and time-traceable.
#   - Do NOT back-project current industry knowledge into historical data.
#
# Layers:
#   core:      semiconductor photoresist explicitly confirmed → core basket
#              (晶瑞电材, 南大光电, 彤程新材, 上海新阳)
#   adjacent:  PCB/display photoresist, broad photosensitive materials
#              → broad basket only, NOT core basket
#   mapping:   semiconductor materials, silicon wafers, CMP, equipment,
#              upstream mapping → sentiment observation only
#
# pit_confidence:
#   high:   annual report / prospectus / official announcement with clear date
#   medium: concept PIT data / industry classification with reasonable lag
#   low:    post-hoc research report / current concept tags / manual recall
#           → EXCLUDED from main backtest (core and broad baskets)
# ===========================================================================

