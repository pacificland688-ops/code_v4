# Factor Quality Rebuild V4 — Configuration
# ============================================
# Calibration: 2017-2020 (direction, transform, parameter selection)
# Validation:   2021-2024 (final gate, must not be used for tuning)
# Watch-only:   2025-2026 (report only, no gate impact)
#
# V4: Extended alpha factor universe with full gate capabilities
# (gate_basis, robustness, capacity) aligned with v2 baseline.

windows:
  calibration:
    start: "20170101"
    end: "20201231"
  validation:
    start: "20210101"
    end: "20241231"
  watch_only:
    start: "20250101"
    end: "20260605"

horizons:
  primary: "fwd_ret_5d"
  auxiliary: ["fwd_ret_10d", "fwd_ret_20d"]

cost:
  single_side_bps: 20
  round_trip_bps: 40
  sensitivity: [10, 20, 30]

# ---------------------------------------------------------------------------
# Gate basis — raw + neutralized dual reporting
# ---------------------------------------------------------------------------
gate_basis:
  raw_required: true
  neutralized_required_for_pass: true
  raw_pass_neutral_fail_status: WATCH_SIZE_DEPENDENT
  raw_fail_neutral_pass_status: WATCH_NEUTRAL_ONLY
  require_valid_neutralization_for_neutral_gate: true

# ---------------------------------------------------------------------------
# Robustness — IC trend + rolling window checks
# ---------------------------------------------------------------------------
robustness:
  ic_decay_p_value: 0.10
  rolling_windows:
    - {name: "2018_2021", start: "20180101", end: "20211231"}
    - {name: "2019_2022", start: "20190101", end: "20221231"}
    - {name: "2020_2023", start: "20200101", end: "20231231"}
    - {name: "2021_2024", start: "20210101", end: "20241231", primary: true}
  min_pass_windows_for_strong_pass: 3

# ---------------------------------------------------------------------------
# Capacity screening
# ---------------------------------------------------------------------------
capacity:
  enabled: true
  target_aum_cny: 1000000000
  max_participation_rate: 0.05
  min_median_amount_cny: 20000000
  capacity_watch_if_unavailable: true
  daily_basic_mv_unit: wan_cny
  amount_unit: derived_from_circ_mv
  assumed_daily_turnover: 0.05

