# ===========================================================================
# Regime Router V2 Configuration — A 方案
# ===========================================================================
# RegimeDetector V2: PIT-normalized scoring, reduced range_bound bias,
# real value_rotation signal.
#
# Differs from regime.yaml (V1) in:
#   - scoring_version: v2 activates PIT expanding z-score normalization
#   - range_bound baseline: 0.0 (was +3.0 in V1)
#   - value_rotation: real value/growth spread (was constant 0.0)
#   - auxiliary_indices for value/growth style state
#
# This config reuses the same sleeve definitions, composite params,
# allocator mapping, and factor_alignment as regime.yaml.
# ===========================================================================

enabled: true

# ---------------------------------------------------------------------------
# Regime Detector — 市场状态识别 (V2)
# ---------------------------------------------------------------------------
regime_detector:
  scoring_version: v2          # <-- V2 scoring path

  # 基准指数代码 (CSI 300)
  index_code: "000300.SH"

  # PIT normalization (V2 only — ignored by V1)
  normalization:
    mode: expanding            # expanding or rolling
    rolling_window_trading_days: 504
    min_warmup_trading_days: 252

  # 趋势强度特征
  trend:
    ma_short: 60
    ma_long: 120
    return_windows: [20, 60, 120]

  # 波动/风险状态特征
  volatility:
    vol_windows: [20, 60]
    drawdown_window: 60

  # 市场宽度特征
  breadth:
    ma_window: 60
    min_stocks: 100

  # 特征平滑
  smoothing:
    halflife: 4

  # V2 scoring parameters
  scoring:
    range_bound_baseline: 0.0    # was +3.0 in V1 — remove structural bias
    # Temperature priority: scoring.temperature > top-level temperature > 1.0
    temperature: 1.0
    value_rotation_enabled: true # use real value/growth spread

  # 辅助指数 (value_rotation V2)
  auxiliary_indices:
    csi300_value: "930917.CSI"    # CSI 300 Value Index
    csi300_growth: "930918.CSI"   # CSI 300 Growth Index

# ---------------------------------------------------------------------------
# Strategy Sleeves — 子策略定义 (same as regime.yaml)
# ---------------------------------------------------------------------------
strategy_sleeves:
  reversal:
    factors:
      - reversal_5_cs
      - reversal_20_cs
      - rsi_14_cs
      - pv_divergence_20_cs

  momentum:
    factors:
      - momentum_60_cs
      - momentum_120_cs
      - macd_12_26_9_cs
      - pv_divergence_20_cs

  defensive:
    factors:
      - volatility_20_cs
      - volatility_60_cs
      - reversal_20_cs

  value:
    factors:
      - ep_cs
      - bp_cs
      - sp_cs

  volume_price:
    factors:
      - pv_divergence_20_cs
      - macd_12_26_9_cs
      - momentum_60_cs
      - volatility_20_cs

# ---------------------------------------------------------------------------
# Sleeve Composite — 子策略内部 IC 加权参数 (same as regime.yaml)
# ---------------------------------------------------------------------------
sleeve_composite:
  ic_window_months: 6
  shrinkage: 0.5
  weight_cap: 0.50
  min_ic_obs: 20
  min_icir: 0.05
  hard_cap: false
  min_active_factors: 2
  coverage_gate_enabled: true
  sign_stability_check: true
  horizon: 5

# ---------------------------------------------------------------------------
# Sleeve Performance Overlay (same as regime.yaml)
# ---------------------------------------------------------------------------
sleeve_performance_overlay:
  enabled: false
  lookback_months: 6
  horizon: 5
  min_obs: 12
  min_stocks: 30
  icir_weight: 0.70
  hit_rate_weight: 0.30
  icir_scale: 0.50
  strength: 0.50
  neutral_multiplier: 1.00
  multiplier_min: 0.60
  multiplier_max: 1.60

# ---------------------------------------------------------------------------
# Allocator — Regime 到 Sleeve 权重映射 (same as regime.yaml)
# ---------------------------------------------------------------------------
allocator:
  min_sleeves: 2
  sleeve_weight_cap: 0.50
  sleeve_weight_floor: 0.05
  max_weekly_weight_change: 0.15

  regime_to_sleeve_weights:
    trend_up:
      momentum: 0.45
      volume_price: 0.25
      reversal: 0.10
      defensive: 0.10
      value: 0.10

    trend_down:
      defensive: 0.45
      value: 0.20
      reversal: 0.20
      momentum: 0.05
      volume_price: 0.10

    range_bound:
      reversal: 0.45
      volume_price: 0.25
      defensive: 0.15
      value: 0.10
      momentum: 0.05

    high_volatility:
      defensive: 0.50
      reversal: 0.20
      value: 0.15
      volume_price: 0.10
      momentum: 0.05

    value_rotation:
      value: 0.45
      defensive: 0.20
      reversal: 0.15
      momentum: 0.10
      volume_price: 0.10

# ---------------------------------------------------------------------------
# Factor Alignment — PIT as-of 对齐 (same as regime.yaml)
# ---------------------------------------------------------------------------
factor_alignment:
  technical_max_stale_trading_days: 5
  fundamental_max_stale_trading_days: 63
  fundamental_factors:
    - ep_cs
    - bp_cs
    - sp_cs
    - log_market_cap_cs
