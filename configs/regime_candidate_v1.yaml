# ===========================================================================
# Regime Candidate v1 — Minimal Sleeve Cleanup
# ===========================================================================
# 基于 factor_signal_alignment.md 的审计结论。
# 修改内容:
#   - reversal sleeve: 移除 rsi_14_cs (IC 不通过)
#   - momentum sleeve: 移除 macd_12_26_9_cs (IC ~0)
#   - defensive sleeve: 移除 volatility_60_cs (冗余), reversal_20_cs (alpha 弱)
#   - volume_price sleeve: 移除 macd_12_26_9_cs, momentum_60_cs (均未通过)
# 经济假设:
#   - 每个 sleeve 只包含在该市场状态下有实证 alpha 的因子
#   - 减少无效因子避免噪音稀释 composite score
#   - Value sleeve 保持不变（当前最可靠）
# 预期改善: 所有年份（减少噪音）
# 可能伤害: 无显著伤害（移除的都是 IC 弱的因子）
# PIT 假设: 不变
# ===========================================================================

enabled: true

regime_detector:
  index_code: "000300.SH"
  trend:
    ma_short: 60
    ma_long: 120
    return_windows: [20, 60, 120]
  volatility:
    vol_windows: [20, 60]
    drawdown_window: 60
  breadth:
    ma_window: 60
    min_stocks: 100
  smoothing:
    halflife: 4

strategy_sleeves:
  # v1: Cleaned — only uses factors from enabled_factors in factors_candidate_v1.yaml
  reversal:
    factors:
      - reversal_5_cs
      - pv_divergence_20_cs

  momentum:
    factors:
      - pv_divergence_20_cs

  defensive:
    factors:
      - ep_cs
      - bp_cs

  value:
    factors:
      - ep_cs
      - bp_cs
      - sp_cs

  volume_price:
    factors:
      - pv_divergence_20_cs

sleeve_composite:
  ic_window_months: 6
  shrinkage: 0.5
  weight_cap: 0.50
  min_ic_obs: 20
  min_icir: 0.05
  hard_cap: false
  min_active_factors: 1       # v1: 降为 1（defensive/volume_price 各自只有 1-2 因子）
  coverage_gate_enabled: true
  sign_stability_check: true
  horizon: 5

sleeve_performance_overlay:
  enabled: false
  lookback_months: 6
  horizon: 5
  min_obs: 12
  min_stocks: 30
  icir_weight: 0.70
  hit_rate_weight: 0.30
  icir_scale: 0.50
  strength: 0.50
  neutral_multiplier: 1.00
  multiplier_min: 0.60
  multiplier_max: 1.60

allocator:
  min_sleeves: 2
  sleeve_weight_cap: 0.50
  sleeve_weight_floor: 0.05
  max_weekly_weight_change: 0.15

  # v1: 保持与 baseline 相同的映射权重
  regime_to_sleeve_weights:
    trend_up:
      momentum: 0.45
      volume_price: 0.25
      reversal: 0.10
      defensive: 0.10
      value: 0.10

    trend_down:
      defensive: 0.45
      value: 0.20
      reversal: 0.20
      momentum: 0.05
      volume_price: 0.10

    range_bound:
      reversal: 0.45
      volume_price: 0.25
      defensive: 0.15
      value: 0.10
      momentum: 0.05

    high_volatility:
      defensive: 0.50
      reversal: 0.20
      value: 0.15
      volume_price: 0.10
      momentum: 0.05

    value_rotation:
      value: 0.45
      defensive: 0.20
      reversal: 0.15
      momentum: 0.10
      volume_price: 0.10

factor_alignment:
  technical_max_stale_trading_days: 5
  fundamental_max_stale_trading_days: 63
  fundamental_factors:
    - ep_cs
    - bp_cs
    - sp_cs
    - log_market_cap_cs
