# ── Basket construction rules (unchanged from v1 — frozen) ──────────────
basket_rules:
  core_basket:
    description: "core 股票等权；30%为冻结名义上限，三成分时不可满足并显式审计"
    pool_types: [core]
    min_pit_confidence: medium
    weight_scheme: equal_weight
    max_single_weight: 0.30
    min_components: 3

  broad_basket:
    description: "core + adjacent，core 权重优先，adjacent 降权"
    pool_types: [core, adjacent]
    min_pit_confidence: medium
    weight_scheme: tiered
    core_weight_multiplier: 2.0
    max_single_weight: 0.25
    min_components: 3

  mapping_sentiment_index:
    description: "mapping 股票只做情绪观察，不作为事件主依据"
    pool_types: [mapping]
    min_pit_confidence: low
    weight_scheme: equal_weight
    research_only: true

