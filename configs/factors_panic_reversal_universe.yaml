# ===========================================================================
# Panic Reversal Candidate Universe — 27 Variants
# ===========================================================================
# 3 directions × 3 thresholds × 3 signal types = 27 candidates
#
# Direction:
#   drop = long extreme losers (mom5 <= -threshold)
#   up   = short extreme winners (mom5 >= threshold)
#   sym  = symmetric: long drops, short surges
#
# Threshold: t03=3%, t05=5%, t07=7%
#
# Signal type:
#   bin   = event=±1, non-event=0
#   cont  = value = -mom5 (drop) / mom5 (up), non-event=0
#   wcont = cont + cross-sectional winsor of non-zero values (5%/95%)
#
# All candidates: weekly frequency, no 5-day smoothing, no vol adjustment.
# ===========================================================================

factors:
  # =========================================================================
  # Panic Drop (long candidates)
  # =========================================================================
  - name: panic_drop_rev5_t03_bin_weekly_cs
    category: panic_reversal
    type: technical
    priority: P1
    sign_hint: positive
    description: "Panic drop reversal: mom5<=-3%, binary signal"
    data_sources: [prices_adj]
    required_fields:
      prices_adj: [adj_close]

  - name: panic_drop_rev5_t03_cont_weekly_cs
    category: panic_reversal
    type: technical
    priority: P1
    sign_hint: positive
