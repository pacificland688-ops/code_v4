# ===========================================================================
# Cross-sectional processing — disabled for panic reversal
# Rationale: these are sparse event-driven signals. Neutralization and
# standardization would inject noise; missing_method=drop preserves the
# sparsity pattern (non-event = 0, not industry median).
# ===========================================================================
cross_section:
  enabled: false
  neutralize: false
  standardize: "none"
  missing_method: "drop"
  min_stocks_for_cs: 10
